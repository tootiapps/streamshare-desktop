name: Desktop beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version without the v prefix
        required: true
        default: 0.1.0-beta.1
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-beta-release
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Beta releases must be dispatched from main." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Expected a version such as 0.1.0-beta.1." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

  build:
    needs: validate-request
    name: Build ${{ matrix.platform }}/${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: arm64
            runner: macos-15
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: win
            architecture: x64
            runner: windows-2025
          - platform: linux
            architecture: x64
            runner: ubuntu-24.04
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      STREAMSHARE_SKIP_FFMPEG_GPU_SMOKE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.9.0
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare beta version
        run: pnpm run release:set-version -- ${{ inputs.version }}

      - name: Validate public source
        run: |
          pnpm run audit:public
          pnpm test
          pnpm audit --prod

      - name: Install macOS media build dependencies
        if: matrix.platform == 'mac'
        run: brew install nasm pkgconf libplacebo molten-vk

      - name: Install Linux media and smoke-test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libasound2t64 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libssl-dev \
            nasm \
            pkg-config \
            rpm \
            xvfb

      - name: Install MSYS2 media build dependencies
        if: matrix.platform == 'win'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers

      - name: Build macOS or Linux FFmpeg bundle
        if: matrix.platform != 'win'
        run: pnpm run ffmpeg:build:host

      - name: Build Windows FFmpeg bundle
        if: matrix.platform == 'win'
        shell: msys2 {0}
        run: bash scripts/build-bundled-ffmpeg.sh win x64

      - name: Build installable packages
        run: pnpm run dist:${{ matrix.platform }}:${{ matrix.architecture }}

      - name: Validate packaged application
        if: matrix.platform != 'linux'
        run: node scripts/smoke-packaged.mjs ${{ matrix.platform }} ${{ matrix.architecture }} --resolve-only

      - name: Smoke-test packaged Linux application
        if: matrix.platform == 'linux'
        run: node scripts/smoke-packaged.mjs linux ${{ matrix.architecture }}

      - name: Generate build metadata and checksums
        run: node scripts/artifact-manifest.mjs ${{ matrix.platform }} ${{ matrix.architecture }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release
          format: spdx-json
          output-file: release/sbom-${{ matrix.platform }}-${{ matrix.architecture }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload verified platform assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            release/Streamshare-TV-Client-*
            release/SHA256SUMS-${{ matrix.platform }}-${{ matrix.architecture }}.txt
            release/build-metadata-${{ matrix.platform }}-${{ matrix.architecture }}.json
            release/sbom-${{ matrix.platform }}-${{ matrix.architecture }}.spdx.json

  attest:
    needs: build
    name: Attest ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - mac-arm64
          - mac-x64
          - win-x64
          - linux-x64
          - linux-arm64

    steps:
      - name: Download platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS-${{ matrix.target }}.txt

      - name: Attest platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS-${{ matrix.target }}.txt
          sbom-path: release/sbom-${{ matrix.target }}.spdx.json

  publish-draft:
    needs:
      - validate-request
      - build
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Download all platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Assemble and verify release
        run: >-
          node scripts/assemble-release.mjs
          --assets release-assets
          --version ${{ inputs.version }}
          --commit ${{ github.sha }}
          --notes release-notes.md

      - name: Preserve verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ inputs.version }}
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StreamShare Desktop $VERSION" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
          echo "Draft release created for $TAG."
